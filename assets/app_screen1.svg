<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18112e" />
      <stop offset="100%" stop-color="#0c0817" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9d26ff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Phone Outline -->
  <rect x="10" y="10" width="340" height="620" rx="36" ry="36" fill="url(#grad1)" stroke="#9d26ff" stroke-width="4" />

  <!-- Notch -->
  <rect x="120" y="20" width="120" height="20" rx="10" ry="10" fill="#0c0817" stroke="#9d26ff" stroke-width="1" />
  <circle cx="150" cy="30" r="4" fill="#c084fc" />

  <!-- App Header -->
  <rect x="25" y="60" width="310" height="50" rx="12" fill="#18112e" stroke="#c084fc" stroke-width="1" />
  <text x="40" y="90" font-family="Orbitron, sans-serif" font-size="14" font-weight="bold" fill="#9d26ff">BOOYAH ESPORTS</text>
  <rect x="220" y="72" width="105" height="26" rx="13" fill="#9d26ff" />
  <text x="235" y="89" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">₹ 1,450.00</text>

  <!-- Match Card 1 -->
  <rect x="25" y="125" width="310" height="165" rx="16" fill="#18112e" stroke="#9d26ff" stroke-width="1.5" />
  <rect x="35" y="135" width="60" height="20" rx="4" fill="#ff2660" />
  <text x="42" y="149" font-family="Rajdhani, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">LIVE NOW</text>

  <text x="35" y="180" font-family="Orbitron, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">BATTLE ROYALE SOLO</text>
  <text x="35" y="202" font-family="Rajdhani, sans-serif" font-size="14" fill="#c084fc">MAP: KALAHARI | ENTRY: ₹30</text>
  <text x="35" y="225" font-family="Orbitron, sans-serif" font-size="14" font-weight="bold" fill="#00f0ff">PRIZE POOL: ₹5,000</text>

  <rect x="35" y="240" width="290" height="38" rx="8" fill="url(#btnGrad)" filter="url(#glow)" />
  <text x="130" y="264" font-family="Orbitron, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">JOIN MATCH</text>

  <!-- Match Card 2 -->
  <rect x="25" y="305" width="310" height="155" rx="16" fill="#18112e" stroke="#c084fc" stroke-width="1" opacity="0.8" />
  <text x="35" y="335" font-family="Orbitron, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">CLASH SQUAD 4v4</text>
  <text x="35" y="358" font-family="Rajdhani, sans-serif" font-size="13" fill="#e2e8f0">MAP: BERMUDA | ENTRY: ₹50</text>
  <text x="35" y="380" font-family="Orbitron, sans-serif" font-size="14" font-weight="bold" fill="#00f0ff">WINNER TAKES: ₹2,000</text>
  <rect x="35" y="395" width="290" height="36" rx="8" fill="#2a1b4e" stroke="#c084fc" stroke-width="1" />
  <text x="135" y="418" font-family="Orbitron, sans-serif" font-size="12" font-weight="bold" fill="#c084fc">REGISTERED</text>

  <!-- Instant Wallet Card -->
  <rect x="25" y="475" width="310" height="80" rx="16" fill="#18112e" stroke="#00f0ff" stroke-width="1" />
  <text x="40" y="502" font-family="Orbitron, sans-serif" font-size="13" font-weight="bold" fill="#00f0ff">INSTANT WITHDRAWAL</text>
  <text x="40" y="525" font-family="Inter, sans-serif" font-size="11" fill="#e2e8f0">UPI / Paytm / PhonePe - 24x7 Active</text>
  <circle cx="290" cy="515" r="15" fill="#00f0ff" opacity="0.2" />

  <!-- Nav Bar -->
  <rect x="25" y="570" width="310" height="45" rx="22" fill="#100b22" stroke="#9d26ff" stroke-width="1" />
  <circle cx="65" cy="592" r="6" fill="#9d26ff" />
  <circle cx="140" cy="592" r="6" fill="#c084fc" opacity="0.5" />
  <circle cx="215" cy="592" r="6" fill="#c084fc" opacity="0.5" />
  <circle cx="290" cy="592" r="6" fill="#c084fc" opacity="0.5" />
</svg>